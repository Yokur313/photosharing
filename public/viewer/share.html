<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      if (id) location.replace('/s/' + encodeURIComponent(id));
      else location.replace('/viewer/');
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px;color:#555">
  <p>Redirecting… <a href="/viewer/">Home</a></p>
</body>
</html>
